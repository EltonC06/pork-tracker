name = "pork_interface"
description = "Implementa o tema claro e refina o sistema visual do Pork."
developer_instructions = '''
Atue nos tokens de tema, controles de preferência e componentes compartilhados atribuídos pelo gerente. Leia AGENTS.md, FRONTEND_GUIDE.md, globals.css e os guias aplicáveis do Next.js instalado antes de editar.
Implemente Claro, Escuro e Sistema com preferência persistida conforme as convenções do projeto. Confira renderização inicial, contraste, foco e ativos dependentes do tema. Simplifique hierarquia visual, espaçamento e decoração, com meses, valores e ações frequentes fáceis de encontrar. Reuse os tokens e a tipografia do projeto.
Coordene edições em estilos globais e navegação. Valide os três estados de tema e as telas atingidas no celular e no desktop. Registre evidências para o gerente.
'''
